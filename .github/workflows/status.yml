# Asterisk status feed.
# Every 15 minutes this reads the official public status pages and saves one small file
# (feed.json) on the "status" branch of this repository. The Asterisk app downloads that
# file when "Online status" is switched on. Only public information is involved.

name: Status feed

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-feed
  cancel-in-progress: true

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the feed
        run: |
          cat > build-feed.mjs <<'ASTERISK_EOF'
          // Builds feed.json for Asterisk's Status page.
          //
          // It reads each platform's OFFICIAL public status page and writes one combined file.
          // It runs on GitHub's computers (see status.yml), so the status sites never see you,
          // and the app downloads the whole file, so nobody learns which accounts you have.
          // Only public information goes in. Nothing is invented: a platform whose status
          // can't be read is marked "unknown" and the app shows "No status".

          const DAY = 86400000;

          // Platforms with a standard "Statuspage" (…/api/v2/summary.json + incidents.json).
          // Several addresses are tried in order; the first one that answers properly is used.
          const STATUSPAGE = {
            discord: ["https://discordstatus.com"],
            github: ["https://www.githubstatus.com"],
            epic: ["https://status.epicgames.com"],
            reddit: ["https://www.redditstatus.com"],
            twitch: ["https://status.twitch.com", "https://status.twitch.tv"],
          };

          const LEVEL = { none: "ok", minor: "issues", maintenance: "issues", major: "down", critical: "down" };

          async function getJson(url, { jsonp = false } = {}) {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 12000);
            try {
              const r = await fetch(url, { signal: ctl.signal, headers: { accept: "application/json", "user-agent": "asterisk-status-feed" } });
              if (!r.ok) throw new Error("HTTP " + r.status);
              let text = await r.text();
              if (jsonp) text = text.replace(/^[^({[]*\(/, "").replace(/\)\s*;?\s*$/, "");
              return JSON.parse(text);
            } finally {
              clearTimeout(timer);
            }
          }

          const day = (iso) => String(iso || "").slice(0, 10);
          const clean = (s) => String(s || "").replace(/\s+/g, " ").trim().slice(0, 140);

          async function statuspage(bases) {
            for (const base of bases) {
              try {
                const s = await getJson(base + "/api/v2/summary.json");
                const level = LEVEL[s?.status?.indicator];
                if (!level) throw new Error("not a status page");
                const out = { status: level, statusText: clean(s.status.description) || undefined, updates: [] };
                try {
                  const inc = await getJson(base + "/api/v2/incidents.json");
                  out.updates = (inc?.incidents ?? [])
                    .filter((i) => i?.name && Date.now() - Date.parse(i.created_at) < 30 * DAY)
                    .slice(0, 3)
                    .map((i) => ({ date: day(i.created_at), title: clean(i.name), kind: i.status === "resolved" || i.status === "postmortem" ? "news" : "policy" }));
                } catch {}
                return out;
              } catch (e) {
                console.log("   ", base, "->", e.message);
              }
            }
            return null;
          }

          // PlayStation Network: an empty "status" list means every service is up.
          async function psn() {
            const j = await getJson("https://status.playstation.com/data/statuses/region/SCEE.json");
            if (!Array.isArray(j?.status) || !Array.isArray(j?.countries)) throw new Error("unexpected shape");
            return j.status.length === 0
              ? { status: "ok", statusText: "All services are up and running", updates: [] }
              : { status: "issues", statusText: "Some services are experiencing issues", updates: [] };
          }

          // Apple: look only at the "Apple Account" (Apple ID) service.
          async function apple() {
            const j = await getJson("https://www.apple.com/support/systemstatus/data/system_status_en_US.js", { jsonp: true });
            if (!Array.isArray(j?.services)) throw new Error("unexpected shape");
            const svc = j.services.find((s) => /^apple (account|id)$/i.test(String(s?.serviceName || "").trim()));
            if (!svc || !Array.isArray(svc.events)) throw new Error("service not listed");
            const open = svc.events.filter((e) => e && !/resolved|completed/i.test(String(e.eventStatus || "")));
            return open.length === 0
              ? { status: "ok", statusText: "Available", updates: [] }
              : { status: "issues", statusText: clean(open[0].statusType || "Issue reported"), updates: [] };
          }

          const OTHER = { psn, apple };

          export async function buildFeed() {
            const platforms = {};
            for (const [id, bases] of Object.entries(STATUSPAGE)) {
              console.log(id);
              platforms[id] = (await statuspage(bases)) ?? { status: "unknown", updates: [] };
              console.log("   =>", platforms[id].status);
            }
            for (const [id, fn] of Object.entries(OTHER)) {
              console.log(id);
              try { platforms[id] = await fn(); }
              catch (e) { console.log("   ->", e.message); platforms[id] = { status: "unknown", updates: [] }; }
              console.log("   =>", platforms[id].status);
            }
            return { updatedAt: new Date().toISOString(), platforms };
          }

          if (import.meta.url === `file://${process.argv[1]}`) {
            const feed = await buildFeed();
            const fs = await import("node:fs");
            fs.writeFileSync("feed.json", JSON.stringify(feed));
            const known = Object.values(feed.platforms).filter((p) => p.status !== "unknown").length;
            console.log(`feed.json written: ${known} of ${Object.keys(feed.platforms).length} platforms have a status`);
          }
          ASTERISK_EOF
          node build-feed.mjs

      - name: Publish it on the status branch
        run: |
          mkdir out && mv feed.json out/ && cd out
          git init -q -b status
          git config user.name "asterisk-status"
          git config user.email "asterisk-status@users.noreply.github.com"
          git add feed.json
          git commit -q -m "Status feed"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" status
